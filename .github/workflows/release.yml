name: Release

on:
  push:
    tags:
      - v*.*.*

permissions:
  id-token: write
  contents: write

jobs:
  build:
    if: github.repository == 'release-drafter/release-drafter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/common-setup

      - name: Run all checks and rebuild artifacts
        run: npm run all

      - name: Check for clean working directory
        run: npm run check:clean

      - name: Publish
        if: false # Publishing is currently disabled, see https://github.com/release-drafter/release-drafter/pull/1475#discussion_r2901869066
        run: npm publish # Publishes to npmjs, using package.json's version

      - name: Parse pushed tag version
        id: version
        run: |
          tag=${GITHUB_REF/refs\/tags\//}
          version=${tag#v}
          major=${version%%.*}
          echo "tag=${tag}" >> $GITHUB_OUTPUT
          echo "version=${version}" >> $GITHUB_OUTPUT
          echo "major=${major}" >> $GITHUB_OUTPUT

      - name: Publish Release
        uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7
        with:
          version: ${{ steps.version.outputs.version }}
          publish: true

      - name: Update major tag
        env:
          MAJOR: ${{ steps.version.outputs.major }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag "v${MAJOR}" "${TAG}" -f
          git push origin "refs/tags/v${MAJOR}" -f
