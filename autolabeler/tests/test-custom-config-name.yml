name: Test custom config-name input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create custom release-drafter config
        run: |
          mkdir -p .github
          cat > .github/my-autolabeler.yml << 'EOF'
          autolabeler:
            - label: 'documentation'
              title:
                - '/docs/i'
            - label: 'chore'
              title:
                - '/chore/i'
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          config-name: 'my-autolabeler.yml'
          dry-run: 'true'

      - name: Assert action ran or failed gracefully on sentinel repo
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with custom config-name"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected on sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
