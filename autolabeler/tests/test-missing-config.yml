name: Test missing config graceful failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure no release-drafter config exists
        run: |
          rm -f .github/release-drafter.yml || true

      - id: action
        uses: .
        continue-on-error: true
        with:
          dry-run: 'true'

      - name: Assert action ran or failed gracefully (no config or no PR context)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (possibly no-op without a PR)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (missing config or sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
