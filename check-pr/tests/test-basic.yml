name: Test basic usage - default config
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true

      - name: Assert action ran and produced labels output or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          LABELS: ${{ steps.action.outputs.labels }}
        run: |
          echo "outcome: $OUTCOME"
          echo "labels: $LABELS"
          if [ "$OUTCOME" = "success" ]; then
            # On success, labels must be a valid JSON array (possibly empty)
            if [ -z "$LABELS" ]; then
              echo "FAIL: action succeeded but labels output is empty (expected at least '[]')"
              exit 1
            fi
            # Validate it looks like a JSON array
            if ! echo "$LABELS" | grep -qE '^\['; then
              echo "FAIL: labels output does not look like a JSON array: $LABELS"
              exit 1
            fi
            echo "PASS: labels output is '$LABELS'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable or no PR context)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
