name: Test basic dry-run mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create release-drafter config
        run: |
          mkdir -p .github
          cat > .github/release-drafter.yml << 'EOF'
          name-template: 'v$RESOLVED_VERSION 🌈'
          tag-template: 'v$RESOLVED_VERSION'
          categories:
            - title: '🚀 Features'
              labels:
                - 'feature'
                - 'enhancement'
            - title: '🐛 Bug Fixes'
              labels:
                - 'fix'
                - 'bugfix'
                - 'bug'
          change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
          template: |
            ## Changes

            $CHANGES
          version-resolver:
            major:
              labels:
                - 'major'
            minor:
              labels:
                - 'minor'
            patch:
              labels:
                - 'patch'
            default: patch
          EOF

      - id: drafter
        uses: .
        with:
          dry-run: 'true'
        continue-on-error: true

      - name: Assert action ran (dry-run or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.drafter.outcome }}
          BODY: ${{ steps.drafter.outputs.body }}
          RESOLVED_VERSION: ${{ steps.drafter.outputs.resolved_version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "body: $BODY"
          echo "resolved_version: $RESOLVED_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded in dry-run mode"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
