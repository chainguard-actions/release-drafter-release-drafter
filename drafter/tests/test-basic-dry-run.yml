name: Test basic dry-run usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create release-drafter config
        run: |
          mkdir -p .github
          cat > .github/release-drafter.yml << 'EOF'
          name-template: 'v$RESOLVED_VERSION 🌈'
          tag-template: 'v$RESOLVED_VERSION'
          categories:
            - title: '🚀 Features'
              labels:
                - 'feature'
                - 'enhancement'
            - title: '🐛 Bug Fixes'
              labels:
                - 'fix'
                - 'bugfix'
                - 'bug'
          change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
          template: |
            ## Changes
            $CHANGES
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          dry-run: 'true'

      - name: Assert action ran (dry-run, sentinel repo may fail gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          BODY: ${{ steps.action.outputs.body }}
          TAG: ${{ steps.action.outputs.tag_name }}
        run: |
          echo "outcome: $OUTCOME"
          echo "body: $BODY"
          echo "tag_name: $TAG"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded in dry-run mode"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
