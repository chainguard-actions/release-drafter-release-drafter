name: Test basic dry-run usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: drafter
        uses: .
        with:
          dry-run: 'true'
        continue-on-error: true
      - name: Assert action ran (dry-run mode, sentinel repo may cause API failure)
        env:
          OUTCOME: ${{ steps.drafter.outcome }}
          BODY: ${{ steps.drafter.outputs.body }}
          TAG_NAME: ${{ steps.drafter.outputs.tag_name }}
        run: |
          echo "outcome: $OUTCOME"
          echo "body: $BODY"
          echo "tag_name: $TAG_NAME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded in dry-run mode"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
