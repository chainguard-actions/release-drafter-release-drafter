name: Test custom config-name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: drafter
        uses: .
        continue-on-error: true
        with:
          config-name: 'custom-release-drafter.yml'
          dry-run: 'true'
          token: ${{ github.token }}

      - name: Assert action ran with custom config name (graceful failure on sentinel repo)
        env:
          OUTCOME: ${{ steps.drafter.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with custom config-name in dry-run mode"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable or config not found)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
