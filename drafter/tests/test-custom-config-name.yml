name: Test custom config name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create custom release-drafter config
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.github"
          cat > "$GITHUB_WORKSPACE/.github/my-release-drafter.yml" << 'EOF'
          name-template: 'v$RESOLVED_VERSION'
          tag-template: 'v$RESOLVED_VERSION'
          categories:
            - title: '🚀 Features'
              labels:
                - 'feature'
          change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
          template: |
            ## Changes

            $CHANGES
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          config-name: 'my-release-drafter.yml'
          dry-run: 'true'

      - name: Assert action ran with custom config (sentinel repo may cause graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with custom config name"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
