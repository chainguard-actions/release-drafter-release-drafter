name: Test custom config name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up custom release-drafter config
        run: |
          mkdir -p .github
          cp tests/fixtures/release-drafter.yml .github/custom-release-drafter.yml

      - id: drafter
        uses: .
        with:
          config-name: 'custom-release-drafter.yml'
          dry-run: 'true'
        continue-on-error: true

      - name: Assert custom config dry-run ran
        env:
          OUTCOME: ${{ steps.drafter.outcome }}
          BODY: ${{ steps.drafter.outputs.body }}
          TAG_NAME: ${{ steps.drafter.outputs.tag_name }}
        run: |
          echo "outcome: $OUTCOME"
          echo "body: $BODY"
          echo "tag_name: $TAG_NAME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with custom config name in dry-run mode"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
