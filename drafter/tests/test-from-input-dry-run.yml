name: Test from input dry-run
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          dry-run: 'true'
          from: 'main'
          version: '1.0.0'
          tag: 'v1.0.0'
          name: 'Release v1.0.0'

      - name: Assert action ran with from input (success or graceful failure on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESOLVED: ${{ steps.action.outputs.resolved_version }}
          BODY: ${{ steps.action.outputs.body }}
        run: |
          echo "outcome: $OUTCOME"
          echo "resolved_version: $RESOLVED"
          echo "body: $BODY"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RESOLVED" ]; then
              echo "FAIL: action succeeded but resolved_version output is empty"
              exit 1
            fi
            echo "PASS: got resolved_version='$RESOLVED'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
