name: Test header and footer inputs in dry-run mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Copy the fixture config into .github so the action can find it
      - name: Set up release-drafter config
        run: |
          mkdir -p .github
          cp tests/fixtures/release-drafter-config/release-drafter.yml .github/release-drafter.yml

      - id: drafter
        uses: .
        with:
          dry-run: 'true'
          header: '## Release Notes Header'
          footer: '## Release Notes Footer'
        continue-on-error: true

      - name: Assert action ran with header/footer (or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.drafter.outcome }}
          BODY: ${{ steps.drafter.outputs.body }}
        run: |
          echo "outcome: $OUTCOME"
          echo "body: $BODY"
          if [ "$OUTCOME" = "success" ]; then
            # If the action succeeded, verify the header/footer appear in the body
            if echo "$BODY" | grep -q "Release Notes Header"; then
              echo "PASS: header found in body"
            else
              echo "INFO: header not found in body (may be empty if no PRs merged)"
            fi
            if echo "$BODY" | grep -q "Release Notes Footer"; then
              echo "PASS: footer found in body"
            else
              echo "INFO: footer not found in body (may be empty if no PRs merged)"
            fi
            echo "PASS: action succeeded with header/footer inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
