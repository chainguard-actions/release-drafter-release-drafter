name: Test prerelease dry-run mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Copy the fixture config into .github so the action can find it
      - name: Set up release-drafter config
        run: |
          mkdir -p .github
          cp tests/fixtures/release-drafter-config/release-drafter.yml .github/release-drafter.yml

      - id: drafter
        uses: .
        with:
          dry-run: 'true'
          prerelease: 'true'
          prerelease-identifier: 'beta'
        continue-on-error: true

      - name: Assert action ran (prerelease dry-run or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.drafter.outcome }}
          BODY: ${{ steps.drafter.outputs.body }}
          RESOLVED_VERSION: ${{ steps.drafter.outputs.resolved_version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "body: $BODY"
          echo "resolved_version: $RESOLVED_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded in prerelease dry-run mode"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
