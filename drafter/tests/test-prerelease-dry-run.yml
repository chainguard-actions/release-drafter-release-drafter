name: Test prerelease dry-run
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create release-drafter config
        run: |
          mkdir -p .github
          cat > .github/release-drafter.yml << 'EOF'
          name-template: 'v$RESOLVED_VERSION-beta'
          tag-template: 'v$RESOLVED_VERSION-beta'
          categories:
            - title: '🚀 Features'
              labels:
                - 'feature'
          change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
          template: |
            ## Changes

            $CHANGES
          EOF

      - id: drafter
        uses: .
        with:
          dry-run: 'true'
          prerelease: 'true'
          prerelease-identifier: 'beta'
        continue-on-error: true

      - name: Assert action ran (dry-run prerelease or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.drafter.outcome }}
          BODY: ${{ steps.drafter.outputs.body }}
        run: |
          echo "outcome: $OUTCOME"
          echo "body: $BODY"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded in dry-run prerelease mode"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
