name: Test prerelease mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: drafter
        uses: .
        with:
          prerelease: 'true'
          prerelease-identifier: 'beta'
          dry-run: 'true'
        continue-on-error: true
      - name: Assert action ran in prerelease mode
        env:
          OUTCOME: ${{ steps.drafter.outcome }}
          BODY: ${{ steps.drafter.outputs.body }}
        run: |
          echo "outcome: $OUTCOME"
          echo "body: $BODY"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded in prerelease dry-run mode"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
