name: Test version override inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create release-drafter config
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.github"
          cat > "$GITHUB_WORKSPACE/.github/release-drafter.yml" << 'EOF'
          name-template: 'v$RESOLVED_VERSION'
          tag-template: 'v$RESOLVED_VERSION'
          template: |
            ## Changes

            $CHANGES
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          dry-run: 'true'
          version: '2.0.0'
          name: 'My Release v2.0.0'
          tag: 'v2.0.0'

      - name: Assert action ran with version overrides (sentinel repo may cause graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TAG: ${{ steps.action.outputs.tag_name }}
          NAME: ${{ steps.action.outputs.name }}
        run: |
          echo "outcome: $OUTCOME"
          echo "tag_name: $TAG"
          echo "name: $NAME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with version overrides"
            # If it succeeded, verify the tag output matches what we set
            if [ -n "$TAG" ] && [ "$TAG" != "v2.0.0" ]; then
              echo "FAIL: expected tag_name 'v2.0.0' but got '$TAG'"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
