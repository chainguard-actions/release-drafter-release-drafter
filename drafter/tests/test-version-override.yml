name: Test version override inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: drafter
        uses: .
        continue-on-error: true
        with:
          dry-run: 'true'
          tag: 'v2.0.0'
          name: 'Release v2.0.0'
          version: '2.0.0'
          token: ${{ github.token }}

      - name: Assert action ran with version overrides (graceful failure on sentinel repo)
        env:
          OUTCOME: ${{ steps.drafter.outcome }}
          TAG_NAME: ${{ steps.drafter.outputs.tag_name }}
          NAME: ${{ steps.drafter.outputs.name }}
        run: |
          echo "outcome: $OUTCOME"
          echo "tag_name: $TAG_NAME"
          echo "name: $NAME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with version overrides in dry-run mode"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
