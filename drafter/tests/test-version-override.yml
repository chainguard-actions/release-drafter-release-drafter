name: Test version override inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up release-drafter config
        run: |
          mkdir -p .github
          cp tests/fixtures/release-drafter.yml .github/release-drafter.yml

      - id: drafter
        uses: .
        with:
          dry-run: 'true'
          name: 'v2.0.0 Test Release'
          tag: 'v2.0.0'
          version: '2.0.0'
        continue-on-error: true

      - name: Assert version override dry-run ran
        env:
          OUTCOME: ${{ steps.drafter.outcome }}
          NAME: ${{ steps.drafter.outputs.name }}
          TAG_NAME: ${{ steps.drafter.outputs.tag_name }}
          RESOLVED: ${{ steps.drafter.outputs.resolved_version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "name: $NAME"
          echo "tag_name: $TAG_NAME"
          echo "resolved_version: $RESOLVED"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with version overrides in dry-run mode"
            # When version is overridden, the outputs should reflect the override
            if [ -n "$TAG_NAME" ] && [ "$TAG_NAME" != "v2.0.0" ]; then
              echo "WARN: tag_name '$TAG_NAME' does not match override 'v2.0.0'"
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
