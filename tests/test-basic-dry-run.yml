name: Test basic dry-run
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@v4

      - name: Create release-drafter config
        run: |
          mkdir -p .github
          cat > .github/release-drafter.yml << 'EOF'
          name-template: 'v$RESOLVED_VERSION'
          tag-template: 'v$RESOLVED_VERSION'
          categories:
            - title: '🚀 Features'
              labels:
                - 'feature'
                - 'enhancement'
            - title: '🐛 Bug Fixes'
              labels:
                - 'fix'
                - 'bugfix'
                - 'bug'
          change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
          template: |
            ## Changes

            $CHANGES
          EOF

      - id: drafter
        uses: .
        with:
          dry-run: 'true'
          token: ${{ github.token }}
        continue-on-error: true

      - name: Assert action ran (dry-run does not require real releases)
        run: |
          echo "Drafter outcome: ${{ steps.drafter.outcome }}"
          # In dry-run mode the action may succeed or fail depending on API access.
          # We just verify the step executed (outcome is set).
          if [ -z "${{ steps.drafter.outcome }}" ]; then
            echo "FAIL: step outcome was not set"
            exit 1
          fi
          echo "PASS: action executed with outcome=${{ steps.drafter.outcome }}"
