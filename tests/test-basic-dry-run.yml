name: Test basic dry-run usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create release-drafter config
        run: |
          mkdir -p .github
          cat > .github/release-drafter.yml << 'EOF'
          template: |
            ## Changes

            $CHANGES
          tag-template: v$MAJOR.$MINOR.$PATCH
          name-template: v$MAJOR.$MINOR.$PATCH
          version-template: $MAJOR.$MINOR.$PATCH
          categories:
            - title: '🚀 Features'
              labels:
                - feature
                - enhancement
            - title: '🐛 Bug Fixes'
              labels:
                - fix
                - bugfix
                - bug
          EOF

      - id: action
        uses: .
        with:
          dry-run: 'true'
        continue-on-error: true

      - name: Assert action ran (dry-run, sentinel repo may cause API failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          BODY: ${{ steps.action.outputs.body }}
          RESOLVED_VERSION: ${{ steps.action.outputs.resolved_version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "body: $BODY"
          echo "resolved_version: $RESOLVED_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded in dry-run mode"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
