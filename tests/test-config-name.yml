name: Test release-drafter custom config-name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create custom release-drafter config
        run: |
          mkdir -p .github
          cat > .github/release-drafter-custom.yml << 'EOF'
          name-template: 'v$RESOLVED_VERSION'
          tag-template: 'v$RESOLVED_VERSION'
          template: |
            # Custom Release Notes

            $CHANGES
          categories:
            - title: 'Bug Fixes'
              semver-increment: 'patch'
              when:
                label: 'bug'
          EOF

      - id: drafter
        uses: .
        with:
          config-name: 'release-drafter-custom.yml'
          dry-run: 'true'
        continue-on-error: true

      - name: Assert action ran with custom config (or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.drafter.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with custom config-name in dry-run mode"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable via GitHub API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
