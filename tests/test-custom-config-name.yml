name: Test custom config-name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@v4

      - name: Create custom release-drafter config
        run: |
          mkdir -p .github
          cat > .github/my-release-drafter.yml << 'EOF'
          name-template: 'v$RESOLVED_VERSION'
          tag-template: 'v$RESOLVED_VERSION'
          categories:
            - title: '🚀 Features'
              labels:
                - 'feature'
          change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
          template: |
            ## Changes

            $CHANGES
          EOF

      - id: drafter
        uses: .
        with:
          dry-run: 'true'
          config-name: 'my-release-drafter.yml'
          token: ${{ github.token }}
        continue-on-error: true

      - name: Assert action ran with custom config name
        run: |
          echo "Drafter outcome: ${{ steps.drafter.outcome }}"
          if [ -z "${{ steps.drafter.outcome }}" ]; then
            echo "FAIL: step outcome was not set"
            exit 1
          fi
          echo "PASS: custom config-name dry-run executed with outcome=${{ steps.drafter.outcome }}"
