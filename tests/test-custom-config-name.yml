name: Test custom config-name input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create custom release-drafter config
        run: |
          mkdir -p .github
          cat > .github/my-release-drafter.yml << 'EOF'
          template: |
            ## What's Changed

            $CHANGES
          tag-template: v$MAJOR.$MINOR.$PATCH
          name-template: 'Release v$MAJOR.$MINOR.$PATCH'
          version-template: $MAJOR.$MINOR.$PATCH
          categories:
            - title: '✨ Enhancements'
              labels:
                - enhancement
          EOF

      - id: action
        uses: .
        with:
          config-name: my-release-drafter.yml
          dry-run: 'true'
          version: '3.1.4'
        continue-on-error: true

      - name: Assert action ran with custom config (sentinel repo may cause API failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESOLVED: ${{ steps.action.outputs.resolved_version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "resolved_version: $RESOLVED"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$RESOLVED" != "3.1.4" ]; then
              echo "FAIL: expected resolved_version '3.1.4', got '$RESOLVED'"
              exit 1
            fi
            echo "PASS: custom config-name accepted and version resolved correctly"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
