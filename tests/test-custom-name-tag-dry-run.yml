name: Test custom name and tag with dry-run
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create release-drafter config
        run: |
          mkdir -p .github
          cat > .github/release-drafter.yml << 'EOF'
          template: |
            ## Changes

            $CHANGES
          name-template: 'v$RESOLVED_VERSION'
          tag-template: 'v$RESOLVED_VERSION'
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          dry-run: 'true'
          name: 'My Custom Release'
          tag: 'v9.9.9'
          version: '9.9.9'

      - name: Assert action ran (custom name/tag dry-run or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          NAME: ${{ steps.action.outputs.name }}
          TAG_NAME: ${{ steps.action.outputs.tag_name }}
          RESOLVED_VERSION: ${{ steps.action.outputs.resolved_version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "name: $NAME"
          echo "tag_name: $TAG_NAME"
          echo "resolved_version: $RESOLVED_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            # If the action succeeded, verify the custom name and tag were used
            if [ "$NAME" != "My Custom Release" ]; then
              echo "FAIL: expected name 'My Custom Release' but got '$NAME'"
              exit 1
            fi
            if [ "$TAG_NAME" != "v9.9.9" ]; then
              echo "FAIL: expected tag_name 'v9.9.9' but got '$TAG_NAME'"
              exit 1
            fi
            echo "PASS: custom name and tag correctly set"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
