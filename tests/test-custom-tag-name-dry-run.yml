name: Test custom tag and name in dry-run mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create release-drafter config
        run: |
          mkdir -p .github
          cat > .github/release-drafter.yml << 'EOF'
          template: |
            ## Changes

            $CHANGES
          tag-template: v$MAJOR.$MINOR.$PATCH
          name-template: Release $MAJOR.$MINOR.$PATCH
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          dry-run: 'true'
          tag: 'v2.0.0'
          name: 'My Custom Release 2.0.0'
          version: '2.0.0'

      - name: Assert action ran with custom tag/name (or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TAG_NAME: ${{ steps.action.outputs.tag_name }}
          NAME: ${{ steps.action.outputs.name }}
          RESOLVED_VERSION: ${{ steps.action.outputs.resolved_version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "tag_name: $TAG_NAME"
          echo "name: $NAME"
          echo "resolved_version: $RESOLVED_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with custom tag/name in dry-run mode"
            if [ -n "$TAG_NAME" ] && [ "$TAG_NAME" != "v2.0.0" ]; then
              echo "FAIL: expected tag_name 'v2.0.0' but got '$TAG_NAME'"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
