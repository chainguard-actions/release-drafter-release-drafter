name: Test custom tag and name overrides
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          dry-run: 'true'
          tag: 'v2.0.0'
          name: 'Release v2.0.0'
          version: '2.0.0'
          token: ${{ github.token }}

      - name: Assert action ran (outputs set, or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ID: ${{ steps.action.outputs.id }}
          TAG_NAME: ${{ steps.action.outputs.tag_name }}
          NAME: ${{ steps.action.outputs.name }}
        run: |
          echo "outcome: $OUTCOME"
          echo "id: $ID"
          echo "tag_name: $TAG_NAME"
          echo "name: $NAME"
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded with custom tag/name in dry-run mode"
            if [ -n "$TAG_NAME" ] && [ "$TAG_NAME" != "v2.0.0" ]; then
              echo "FAIL: expected tag_name 'v2.0.0' but got '$TAG_NAME'"
              exit 1
            fi
            echo "PASS: action ran successfully with custom tag/name"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable on GitHub)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
