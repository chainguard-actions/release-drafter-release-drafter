name: Test dry-run with name/tag/version overrides
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create release-drafter config
        run: |
          mkdir -p .github
          cat > .github/release-drafter.yml << 'EOF'
          template: |
            ## Changes

            $CHANGES
          tag-template: v$MAJOR.$MINOR.$PATCH
          name-template: v$MAJOR.$MINOR.$PATCH
          version-template: $MAJOR.$MINOR.$PATCH
          EOF

      - id: action
        uses: .
        with:
          dry-run: 'true'
          name: 'My Release v2.0.0'
          tag: 'v2.0.0'
          version: '2.0.0'
        continue-on-error: true

      - name: Assert action ran with overrides (sentinel repo may cause API failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          NAME: ${{ steps.action.outputs.name }}
          TAG_NAME: ${{ steps.action.outputs.tag_name }}
          MAJOR: ${{ steps.action.outputs.major_version }}
          MINOR: ${{ steps.action.outputs.minor_version }}
          PATCH: ${{ steps.action.outputs.patch_version }}
          RESOLVED: ${{ steps.action.outputs.resolved_version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "name: $NAME"
          echo "tag_name: $TAG_NAME"
          echo "major_version: $MAJOR"
          echo "minor_version: $MINOR"
          echo "patch_version: $PATCH"
          echo "resolved_version: $RESOLVED"
          if [ "$OUTCOME" = "success" ]; then
            # When the action succeeds, validate that overrides were respected
            if [ "$NAME" != "My Release v2.0.0" ]; then
              echo "FAIL: expected name 'My Release v2.0.0', got '$NAME'"
              exit 1
            fi
            if [ "$TAG_NAME" != "v2.0.0" ]; then
              echo "FAIL: expected tag_name 'v2.0.0', got '$TAG_NAME'"
              exit 1
            fi
            if [ "$RESOLVED" != "2.0.0" ]; then
              echo "FAIL: expected resolved_version '2.0.0', got '$RESOLVED'"
              exit 1
            fi
            echo "PASS: overrides applied correctly"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
