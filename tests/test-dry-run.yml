name: Test release-drafter dry-run
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create release-drafter config
        run: |
          mkdir -p .github
          cat > .github/release-drafter.yml << 'EOF'
          name-template: 'v$RESOLVED_VERSION 🌈'
          tag-template: 'v$RESOLVED_VERSION'
          categories:
            - title: '🚀 Features'
              labels:
                - 'feature'
                - 'enhancement'
            - title: '🐛 Bug Fixes'
              labels:
                - 'fix'
                - 'bugfix'
                - 'bug'
          change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
          template: |
            ## Changes

            $CHANGES
          EOF

      - id: action
        uses: .
        with:
          dry-run: 'true'
          token: ${{ github.token }}
        continue-on-error: true

      - name: Assert action ran (dry-run may fail without real GitHub context but should not crash)
        run: |
          echo "Action completed with outcome: ${{ steps.action.outcome }}"
          # In dry-run mode the action attempts to connect to GitHub API.
          # Under act without real credentials it may fail with an API error,
          # but it should not produce an unexpected crash (exit code 1 from the runner itself).
          # We accept both success and failure outcomes here since the token is not real.
          if [ "${{ steps.action.outcome }}" = "cancelled" ]; then
            echo "FAIL: action was cancelled unexpectedly"
            exit 1
          fi
          echo "PASS: action ran to completion (success or expected API failure)"
