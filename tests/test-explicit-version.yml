name: Test explicit version override
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create release-drafter config
        run: |
          mkdir -p .github
          cat > .github/release-drafter.yml << 'EOF'
          name-template: 'v$RESOLVED_VERSION'
          tag-template: 'v$RESOLVED_VERSION'
          template: |
            ## Changes

            $CHANGES
          EOF

      - id: drafter
        uses: .
        with:
          version: '2.0.0'
          tag: 'v2.0.0'
          name: 'Release v2.0.0'
          dry-run: 'true'
        continue-on-error: true

      - name: Assert action ran with explicit version inputs
        env:
          OUTCOME: ${{ steps.drafter.outcome }}
          TAG_NAME: ${{ steps.drafter.outputs.tag_name }}
          NAME: ${{ steps.drafter.outputs.name }}
        run: |
          echo "outcome: $OUTCOME"
          echo "tag_name: $TAG_NAME"
          echo "name: $NAME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with explicit version override"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable via GitHub API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
