name: Test header and footer inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create release-drafter config
        run: |
          mkdir -p .github
          cat > .github/release-drafter.yml << 'EOF'
          template: |
            ## Changes

            $CHANGES
          tag-template: v$MAJOR.$MINOR.$PATCH
          name-template: v$MAJOR.$MINOR.$PATCH
          version-template: $MAJOR.$MINOR.$PATCH
          EOF

      - id: action
        uses: .
        with:
          dry-run: 'true'
          version: '1.2.3'
          header: '> This release was auto-drafted.'
          footer: '---\nThank you to all contributors!'
        continue-on-error: true

      - name: Assert action ran with header/footer (sentinel repo may cause API failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          BODY: ${{ steps.action.outputs.body }}
          RESOLVED: ${{ steps.action.outputs.resolved_version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "resolved_version: $RESOLVED"
          echo "body: $BODY"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with header/footer inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
