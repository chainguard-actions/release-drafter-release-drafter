name: Test header and footer inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create release-drafter config
        run: |
          mkdir -p .github
          cat > .github/release-drafter.yml << 'EOF'
          name-template: 'v$RESOLVED_VERSION'
          tag-template: 'v$RESOLVED_VERSION'
          categories:
            - title: '🚀 Features'
              labels:
                - 'feature'
          template: |
            ## Changes
            $CHANGES
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          header: '## 🎉 Welcome to this release!'
          footer: '---\nThank you to all contributors!'
          dry-run: 'true'

      - name: Assert action ran with header/footer or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          BODY: ${{ steps.action.outputs.body }}
        run: |
          echo "outcome: $OUTCOME"
          echo "body: $BODY"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with header and footer"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable via GitHub API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
