name: Test initial-commits-since input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create release-drafter config
        run: |
          mkdir -p .github
          cat > .github/release-drafter.yml << 'EOF'
          template: |
            $CHANGES
          categories:
            - title: 'Changes'
              labels:
                - 'feature'
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          dry-run: 'true'
          initial-commits-since: '2020-01-01T00:00:00Z'

      - name: Assert action ran with initial-commits-since input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          BODY: ${{ steps.action.outputs.body }}
        run: |
          echo "outcome: $OUTCOME"
          echo "body: $BODY"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with initial-commits-since input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
