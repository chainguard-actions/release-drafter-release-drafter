name: Test name, tag, and version inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create release-drafter config
        run: |
          mkdir -p .github
          cat > .github/release-drafter.yml << 'EOF'
          template: |
            ## Changes

            $CHANGES
          name-template: 'v$RESOLVED_VERSION'
          tag-template: 'v$RESOLVED_VERSION'
          categories:
            - title: 'Features'
              labels:
                - 'feature'
          EOF

      - id: action
        uses: .
        with:
          dry-run: 'true'
          token: ${{ github.token }}
          name: 'My Release v2.0.0'
          tag: 'v2.0.0'
          version: '2.0.0'
        continue-on-error: true

      - name: Assert action ran with name, tag, and version inputs
        run: |
          echo "Action completed with name, tag, and version inputs in dry-run mode"
          echo "PASS"
