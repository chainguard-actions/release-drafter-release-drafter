name: Test prerelease dry-run
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create release-drafter config
        run: |
          mkdir -p .github
          cat > .github/release-drafter.yml << 'EOF'
          template: |
            ## Changes

            $CHANGES
          tag-template: v$MAJOR.$MINOR.$PATCH-$PRERELEASE
          name-template: v$MAJOR.$MINOR.$PATCH-$PRERELEASE
          version-template: $MAJOR.$MINOR.$PATCH
          EOF

      - id: action
        uses: .
        with:
          dry-run: 'true'
          prerelease: 'true'
          prerelease-identifier: 'beta'
          version: '1.0.0'
        continue-on-error: true

      - name: Assert prerelease action ran (sentinel repo may cause API failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TAG_NAME: ${{ steps.action.outputs.tag_name }}
          RESOLVED: ${{ steps.action.outputs.resolved_version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "tag_name: $TAG_NAME"
          echo "resolved_version: $RESOLVED"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: prerelease dry-run succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
