name: Test prerelease dry-run
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          dry-run: 'true'
          prerelease: 'true'
          prerelease-identifier: 'beta'
          token: ${{ github.token }}

      - name: Assert action ran (outputs set, or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ID: ${{ steps.action.outputs.id }}
          TAG_NAME: ${{ steps.action.outputs.tag_name }}
        run: |
          echo "outcome: $OUTCOME"
          echo "id: $ID"
          echo "tag_name: $TAG_NAME"
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded in prerelease dry-run mode"
            echo "PASS: action ran successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable on GitHub)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
