name: Test prerelease mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create release-drafter config for prerelease
        run: |
          mkdir -p .github
          cat > .github/release-drafter.yml << 'EOF'
          name-template: 'v$RESOLVED_VERSION'
          tag-template: 'v$RESOLVED_VERSION'
          version-template: '$MAJOR.$MINOR.$PATCH'
          categories:
            - title: '🚀 Features'
              labels:
                - 'feature'
            - title: '🐛 Bug Fixes'
              labels:
                - 'bug'
          template: |
            ## Changes

            $CHANGES
          EOF

      - id: drafter
        uses: .
        with:
          prerelease: 'true'
          prerelease-identifier: 'beta'
          dry-run: 'true'
        continue-on-error: true

      - name: Assert prerelease action ran (or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.drafter.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded in prerelease dry-run mode"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
