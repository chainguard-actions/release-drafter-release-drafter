name: Test prerelease mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create release-drafter config
        run: |
          mkdir -p .github
          cat > .github/release-drafter.yml << 'EOF'
          name-template: 'v$RESOLVED_VERSION'
          tag-template: 'v$RESOLVED_VERSION'
          template: |
            # What's Changed

            $CHANGES
          EOF

      - id: drafter
        uses: .
        with:
          dry-run: 'true'
          prerelease: 'true'
          prerelease-identifier: 'beta'
        continue-on-error: true

      - name: Assert action ran (outputs set, or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.drafter.outcome }}
          TAG_NAME: ${{ steps.drafter.outputs.tag_name }}
          BODY: ${{ steps.drafter.outputs.body }}
          RESOLVED: ${{ steps.drafter.outputs.resolved_version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "tag_name: $TAG_NAME"
          echo "body: $BODY"
          echo "resolved_version: $RESOLVED"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded in prerelease mode"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
