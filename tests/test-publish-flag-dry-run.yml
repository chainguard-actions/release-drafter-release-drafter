name: Test publish flag dry-run
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@v4
      - id: drafter
        uses: .
        with:
          token: ${{ github.token }}
          publish: 'false'
          dry-run: 'true'
        continue-on-error: true

      - name: Assert action ran without unexpected crash
        env:
          OUTCOME: ${{ steps.drafter.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may fail due to missing config or API limits in test env,
          # but it should not crash with an unhandled exception on the publish input.
          # We accept both success and failure (config not found), but not a setup error.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action handled publish flag without crashing"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
