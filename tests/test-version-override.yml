name: Test release-drafter version override inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create release-drafter config
        run: |
          mkdir -p .github
          cat > .github/release-drafter.yml << 'EOF'
          name-template: 'v$RESOLVED_VERSION'
          tag-template: 'v$RESOLVED_VERSION'
          template: |
            ## Changes

            $CHANGES
          EOF

      - id: action
        uses: .
        with:
          name: 'My Custom Release v2.0.0'
          tag: 'v2.0.0'
          version: '2.0.0'
          dry-run: 'true'
          token: ${{ github.token }}
        continue-on-error: true

      - name: Assert action ran with version overrides
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action should attempt to run with the version override inputs.
          # Under act without real GitHub credentials it may fail at the API call stage,
          # but it should not be cancelled or produce an unexpected runner error.
          if [ "${{ steps.action.outcome }}" = "cancelled" ]; then
            echo "FAIL: action was cancelled unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with version override inputs"
