name: Test version override inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create release-drafter config
        run: |
          mkdir -p .github
          cat > .github/release-drafter.yml << 'EOF'
          name-template: 'v$RESOLVED_VERSION'
          tag-template: 'v$RESOLVED_VERSION'
          version-template: '$MAJOR.$MINOR.$PATCH'
          categories:
            - title: '🚀 Features'
              labels:
                - 'feature'
            - title: '🐛 Bug Fixes'
              labels:
                - 'bug'
          template: |
            ## Changes
            $CHANGES
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          tag: 'v2.5.0'
          name: 'Release v2.5.0'
          version: '2.5.0'
          dry-run: 'true'

      - name: Assert action ran with version override or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TAG: ${{ steps.action.outputs.tag_name }}
          NAME: ${{ steps.action.outputs.name }}
          MAJOR: ${{ steps.action.outputs.major_version }}
          MINOR: ${{ steps.action.outputs.minor_version }}
          PATCH: ${{ steps.action.outputs.patch_version }}
          RESOLVED: ${{ steps.action.outputs.resolved_version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "tag_name: $TAG"
          echo "name: $NAME"
          echo "major_version: $MAJOR"
          echo "minor_version: $MINOR"
          echo "patch_version: $PATCH"
          echo "resolved_version: $RESOLVED"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with version override"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable via GitHub API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
