name: Test version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          dry-run: 'true'
          token: ${{ github.token }}
          version: '2.0.0'
        continue-on-error: true
      - name: Assert action ran with version input
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # Verify the action ran (not skipped) — dry-run with explicit version
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped"
            exit 1
          fi
          echo "PASS: action ran with version input"
