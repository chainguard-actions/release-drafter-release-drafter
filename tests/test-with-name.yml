name: Test with name input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create release-drafter config
        run: |
          mkdir -p .github
          cat > .github/release-drafter.yml << 'EOF'
          name-template: 'v$RESOLVED_VERSION 🌈'
          tag-template: 'v$RESOLVED_VERSION'
          categories:
            - title: '🚀 Features'
              labels:
                - 'feature'
                - 'enhancement'
          change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
          template: |
            ## Changes

            $CHANGES
          EOF

      - id: action
        uses: .
        with:
          name: 'My Custom Release Name'
          dry-run: 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Assert name output matches custom name
        env:
          ACTUAL: ${{ steps.action.outputs.name }}
        run: |
          echo "actual name: $ACTUAL"
          if [ "$ACTUAL" != "My Custom Release Name" ]; then
            echo "FAIL: expected 'My Custom Release Name' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: name output matches custom name"
