name: Test with version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create release-drafter config
        run: |
          mkdir -p .github
          cat > .github/release-drafter.yml << 'EOF'
          name-template: 'v$RESOLVED_VERSION 🌈'
          tag-template: 'v$RESOLVED_VERSION'
          categories:
            - title: '🚀 Features'
              labels:
                - 'feature'
                - 'enhancement'
          change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
          template: |
            ## Changes

            $CHANGES
          EOF

      - id: action
        uses: .
        with:
          version: '5.0.0'
          dry-run: 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Assert resolved_version output reflects custom version
        env:
          ACTUAL: ${{ steps.action.outputs.resolved_version }}
        run: |
          echo "actual resolved_version: $ACTUAL"
          if [ "$ACTUAL" != "5.0.0" ]; then
            echo "FAIL: expected '5.0.0' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: resolved_version output matches custom version"
